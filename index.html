<!doctype html>
<html>
  <head>
    <title>Materials</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>

    <link rel="stylesheet" href="style.css">
  </head>

  <body>

    

    <!-- core three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>

    <script>
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true; // Shadow
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();

      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000,
      );
      camera.position.set(0, 2, 5);
      camera.lookAt(0, 0, 0);
      const controls = new THREE.OrbitControls(camera, renderer.domElement);

      const abmientLight = new THREE.AmbientLight(0x404040, 1); // soft white light
      scene.add(abmientLight);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
      directionalLight.position.set(10, 10, 10);
      directionalLight.castShadow = true;
      scene.add(directionalLight);

      const exrSkyboxUrl =
        "https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/1k/venice_sunset_1k.exr";
      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      pmremGenerator.compileEquirectangularShader();

      new THREE.EXRLoader().setDataType(THREE.UnsignedByteType).load(
        exrSkyboxUrl,
        (texture) => {
          const skybox = pmremGenerator.fromEquirectangular(texture).texture;
          scene.background = skybox;
          scene.environment = skybox;

          texture.dispose();
          pmremGenerator.dispose();
        },
        undefined,
        (error) => {
          console.error("Unable to load EXR skybox:", error);
        },
      );

      // ใส่พื้น
      const texFloor = new THREE.TextureLoader().load(
        "https://sibsansuk.github.io/mossy_cobblestone_diff_1k.jpg",
        (t) => {},
      );
      const matFloor = new THREE.MeshStandardMaterial({
        map: texFloor,
        side: THREE.DoubleSide,
      });
      const planeGeometry = new THREE.PlaneGeometry(10, 10);
      const plane = new THREE.Mesh(planeGeometry, matFloor);
      plane.rotation.x = -Math.PI / 2;
      plane.receiveShadow = true;

      scene.add(plane);

      // load glb และใช้ pbr material
      let lucarioMaterial = null;
      let lucarioModel = null;
      const loader = new THREE.GLTFLoader();
      loader.load("https://chanamor.github.io/comgraph/lucar1.glb", (gltf) => {
        lucarioModel = gltf.scene;
        lucarioModel.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            if (!lucarioMaterial && child.material) {
              lucarioMaterial = child.material;
            }
          }
        });
        lucarioModel.position.set(0, 0.1, 0);
        scene.add(lucarioModel);
      });

      // สร้าง GUI (แก้ไขเป็น lil.GUI)
      const gui = new lil.GUI();

      // 1. ปรับตำแหน่งแหล่งกำเนิดแสง (DirectionalLight)
      const lightFolder = gui.addFolder('Directional Light');
      lightFolder.add(directionalLight.position, 'x', -20, 20).name('Position X');
      lightFolder.add(directionalLight.position, 'y', 0, 20).name('Position Y');
      lightFolder.add(directionalLight.position, 'z', -20, 20).name('Position Z');
      lightFolder.add(directionalLight, 'intensity', 0, 5).name('Intensity');
      lightFolder.open();

      const pbrFolder = gui.addFolder('Lucario PBR Material');
      const pbrParams = { metallic: 0.1, roughness: 0.5 };

      pbrFolder.add(pbrParams, 'metallic', 0, 1).name('Metallic').onChange((value) => {
        if (lucarioMaterial) lucarioMaterial.metalness = value;
      });

      pbrFolder.add(pbrParams, 'roughness', 0, 1).name('Roughness').onChange((value) => {
        if (lucarioMaterial) lucarioMaterial.roughness = value;
      });
      pbrFolder.open();



      
    const buildingLoader = new THREE.GLTFLoader();
    buildingLoader.load("./island_tree_02_1k.glb", (gltf) => {
    const buildingModel = gltf.scene;

    buildingModel.traverse((child) => {
    if (child.isMesh) {
      child.castShadow = true;
      child.receiveShadow = true;
    }
  });

 
    buildingModel.position.set(4, 0, -1);
    buildingModel.scale.set(1, 1, 1);

    scene.add(buildingModel);
});
      

      // Animation Loop (ลบ mesh.rotation.y ออก)
      function animate(t) {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
      animate(0);

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
